name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://projectsautodetailing.com
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `typecheck` runs `next typegen` first, so route types exist on a clean checkout.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Same settings as deploy-pages.yml, so static-export breakage fails CI, not the deploy.
      - name: Static export build (GitHub Pages)
        run: |
          STATIC_EXPORT=true \
          NEXT_PUBLIC_BASE_PATH=/Projects-Auto-Detailing \
          NEXT_PUBLIC_SITE_URL=https://kuzynx.github.io/Projects-Auto-Detailing \
          pnpm build
          rm -rf out .next

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
